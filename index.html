    else if ((m = line.match(/^\s*(\d+)[.)]\s+(.*)/))) {
      const k = +m[1];
      if (top != 'ol' || k <= n) { endTop(); out += k == 1 ? '<ol>' : `<ol start="${k}">`; top = 'ol'; } else endLi();
      n = k; out += `<li>${inl(m[2])}`; li = true;
    } else if ((m = line.match(/^\s*[-*•]\s+(.*)/))) {
      if (li && (top == 'ol' || ind >= 2)) { if (!sub) out += '<ul>'; sub = true; out += `<li>${inl(m[1])}</li>`; }
      else { if (top != 'ul') { endTop(); out += '<ul>'; top = 'ul'; } else endLi(); out += `<li>${inl(m[1])}`; li = true; }
    } else if (li && ind >= 2) { endSub(); out += `<p>${inl(line.trim())}</p>`; }
    else {
      endTop();
      if ((m = line.match(/^#{1,6}\s+(.*)/))) out += `<h3>${inl(m[1])}</h3>`; else out += `<p>${inl(line)}</p>`;
    }
  }
  endTop(); return out;
}
function admItem(e, T) {
  if (e.type == 'attach') return `<div class="a-say">${atts(e.files)}</div>`;
  if (e.type == 'input') return e.text.trim() == '/compact' ? '' : `<div class="a-you"><span class="sr">Tú: </span>${esc(e.text)}${atts(e.files)}</div>`;
  const note = (ic, h) => `<div class="a-note">${icon(ic)}<span>${h}</span></div>`;
  if (e.type == 'ask') return note('bell', e.tool == 'AskUserQuestion' ? `Te preguntó: <b>${esc(e.input.questions?.map(q => q.question).join(' / '))}</b>` : `Te pidió permiso: <b>${esc(admPerm(e).t)}</b>`);
  if (e.type == 'answer') return note(e.allow ? 'check' : 'x', e.tool == 'AskUserQuestion'
    ? (e.allow ? `Respondiste: <b>${esc(Object.values(e.answers || {}).join(' / '))}</b>` : 'Le dejaste decidir a él')
    : e.allow ? 'Le diste permiso' + (e.always || e.all ? ' para toda esta petición' : '') : 'Le dijiste que no' + (e.message && !/^The user/.test(e.message) ? ': ' + esc(e.message) : ''));
  const c = Array.isArray(e.message?.content) ? e.message.content : [];
  if (e.type == 'assistant') return c.map(x => {
    if (x.type == 'text' && x.text.trim()) return `<div class="a-say">${admMd(x.text)}</div>`;
    if (x.type != 'tool_use' || HIDDEN_TOOLS.includes(x.name)) return '';
    if (T[x.id]) return `<div class="a-act">${icon('team')}<span>Un ayudante se encarga de: ${esc(T[x.id].desc)}</span></div>`;
    const k = toolCat(x.name), d = x.input?.subject || x.input?.summary || x.input?.title;
    return `<div class="a-act">${icon(KEYS[k]?.i || 'dot')}<span>${admActText(x.name)}${d ? ': «' + esc(String(d).slice(0, 90)) + '»' : ''}</span></div>`;
  }).join('');
  if (e.type == 'system' && e.subtype == 'task_notification' && T[e.tool_use_id]) return note(e.status == 'completed' ? 'check' : 'x', `${e.status == 'completed' ? 'Un ayudante ha terminado' : 'Un ayudante no pudo terminar'}: ${esc(T[e.tool_use_id].desc)}`);
  if (e.type == 'system' && e.subtype == 'api_retry') return note('clock', 'Reconectando con Claude…');
  if (e.type == 'result' && e.is_error) return `<div class="a-err"><span class="a-hatch" aria-hidden="true"></span><span>Algo ha fallado y esta parte no se ha podido terminar. Puedes escribir abajo para intentarlo otra vez.</span></div>`;
  return '';  // tool results, costs, raw output: never shown here
}
const LIVE_LINE = {working: 'Trabajando en tu petición…', asking: 'Te necesita: contesta la pregunta para seguir.', idle: 'Listo. Lee la respuesta y, si quieres, pide algo más.',
  stopped: 'Pausado. Si escribes algo abajo, seguimos donde lo dejamos.', failed: 'No se pudo terminar. Escribe abajo para intentarlo otra vez.',
  done: 'Listo. Lee la respuesta y, si quieres, pide algo más.',
  waiting: 'En espera: has llegado al límite de uso por ahora. Seguirá sola en cuanto se pueda.'};
function admDrawSession() {
  const r = sess.r, T = tasksOf(sess.events), st = admSt(r);
  if (!$('#a-log')) {
    main.innerHTML = `<div class="a-col"><header class="a-where" id="a-where"></header><div id="s-ask"></div>
      <section class="logbox a-log" id="a-log" aria-label="Conversación"></section><p class="a-live" id="a-live" role="status"></p></div>
      <div class="a-comp" id="composer"><div class="a-compin">
        <label class="sr" for="msg">Responder o pedir algo más</label>
        <textarea id="msg" rows="2" placeholder="Responder o pedir algo más"></textarea>
        <div class="atts" id="atts" aria-label="Archivos adjuntos"></div>
        <div class="a-bar">
          <button type="button" class="a-small" data-act="attach">${icon('clip')}<span class="lbl">Adjuntar</span></button>
          ${micBtn('#msg', 'a-small')}<span class="grow"></span>
          <button type="button" class="a-btn a-pri" data-act="sendMsg">Enviar</button>
        </div>
      </div></div>`;
    $('#msg').addEventListener('keydown', e => { if (e.key == 'Enter' && (e.ctrlKey || e.metaKey)) ACT.sendMsg(); });
  }
  setHTML('#a-where', `<a class="a-back" href="#mis">${icon('left')}Mis peticiones</a>
    <div class="a-wh"><h1>${esc(catName(r.id))}</h1>${astate(st)}
    ${['working', 'asking'].includes(r.status) ? `<button type="button" class="a-small a-stop" data-act="admStop">${icon('stop')}Parar</button>` : ''}</div>`);
  const l = $('#a-live'); l.className = 'a-live ' + st;
  withLogScroll(() => {
    setHTML('#a-live', LIVE_LINE[st] && st != 'idle' && st != 'done' ? `${st == 'working' ? icon('dot') : ''}<span>${LIVE_LINE[st]}</span>` : '');
    setHTML('#a-log', capLog(sess.events.filter(e => !e.parent_tool_use_id), e => admItem(e, T)));
  });
  $('#composer').classList.toggle('yours', st == 'idle' || st == 'done');
}
ACT.admStop = async () => {
  if (!confirm('¿Parar esta petición? Podrás seguir con ella más tarde escribiendo un mensaje.')) return;
  try { await api(`sessions/${sess.id}/stop`, {method: 'POST'}); toast('Petición parada'); } catch { toast('No se ha podido parar. Inténtalo otra vez.', true); }
};

/* ---- decisions: same reply()/ACT handlers as dev, plain-language rendering ---- */
const admAskBar = (pend, q) => `<button class="a-askbar" data-act="openAsk"><span class="a-flag">Te necesita</span><span class="a-an">${pend.length > 1 ? pend.length + ' preguntas · ' : ''}${esc(q.tool == 'AskUserQuestion' ? (q.input.questions || []).map(x => x.question).join(' · ') : admPerm(q).t)}</span><span class="go">Contestar ${icon('right')}</span></button>`;
const admBand = () => `<div class="a-band"><h2 id="decide-h">Necesito que decidas</h2><p>${esc(catName(sess?.id))} · ${esc(sess?.r?.name || '')}</p></div>`;
function admAskQ(qs) {
  return `<form method="dialog" id="ask-form">${admBand()}<div class="a-dbody">
    ${qs.map((x, i) => `<fieldset><legend>${esc(x.question)}</legend>${x.multiSelect ? '<p class="a-hint">Puedes elegir varias.</p>' : ''}
      ${(x.options || []).map((o, j) => `<label class="opt"><input type="${x.multiSelect ? 'checkbox' : 'radio'}" name="q${i}" value="${esc(o.label)}" ${!x.multiSelect && j == 0 ? 'required' : ''}>
        <span class="box">${icon('check')}</span><span><b>${esc(o.label)}</b>${o.description ? `<small>${esc(o.description)}</small>` : ''}</span></label>`).join('')}
      <label class="opt other"><input type="${x.multiSelect ? 'checkbox' : 'radio'}" name="q${i}" value="__other"><span class="box">${icon('check')}</span>
        <span style="flex:1"><b>Otra cosa</b><input type="text" name="o${i}" placeholder="Escríbelo aquí" aria-label="Otra respuesta"></span></label></fieldset>`).join('')}
    </div><div class="dfoot">
      <button type="button" class="a-btn a-q" data-act="skipAsk">Decide tú</button><span class="grow"></span>
      <button type="button" class="a-btn a-sec" data-act="closeAsk">Más tarde</button>
      <button type="submit" class="a-btn a-pri">${icon('send')}Enviar respuesta</button>
    </div></form>`;
}
function admPerm(q) {  // what the agent wants to do, as a plain question plus the facts that matter
  const n = q.tool || '', i = q.input || {}, all = v => [].concat(v || []).join(', ');
  const text = v => String(v || '').replace(/<br\s*\/?>|<\/p>/gi, '\n').replace(/<[^>]+>/g, '').trim();
  const when = v => { if (!v) return ''; const d = new Date(v.dateTime || v.date || v); return isNaN(d) ? String(v.dateTime || v.date || v) : d.toLocaleString('es-ES', {weekday: 'long', day: 'numeric', month: 'long', ...(v.date && !v.dateTime ? {} : {hour: '2-digit', minute: '2-digit'})}); };
  if (/Gmail__(send_message|reply|forward)/.test(n)) return {t: i.draftId && !i.body ? '¿Puedo enviar este borrador?' : '¿Puedo enviar este correo?', rows: [['Para', all(i.to)], ['Copia', all(i.cc)], ['Asunto', i.subject]], body: i.body || text(i.htmlBody)};
  if (/Gmail__(create_draft|update_draft)/.test(n)) return {t: '¿Puedo guardar este borrador?', rows: [['Para', all(i.to)], ['Asunto', i.subject]], body: i.body || text(i.htmlBody), hint: 'Se guarda en tus borradores. No se envía.'};
  if (/Drive__(create_file|update_file|copy_file)/.test(n)) return {t: '¿Puedo guardar este documento?', rows: [['Nombre', i.title || i.name]], body: String(i.textContent || '').slice(0, 1500)};
  if (/Drive__share_file/.test(n)) return {t: '¿Puedo compartir este documento?', rows: [['Con', all(i.emailAddress || i.email || i.emails)]]};
  if (/Calendar__(create_event|update_event)/.test(n)) return {t: '¿Puedo apuntar esto en tu agenda?', rows: [['Qué', i.summary || i.title], ['Cuándo', when(i.start || i.startTime)], ['Hasta', when(i.end || i.endTime)], ['Dónde', i.location], ['Con', all((i.attendees || []).map(a => a.email || a))]], body: i.description};
  return {t: '¿Puedo hacer esto?', rows: [['Qué', admActText(n).replace('…', '')]]};
}
function admAskPerm(q) {
  const p = admPerm(q), rows = p.rows.filter(([, v]) => v);
  return `<form method="dialog" id="ask-form">${admBand()}<div class="a-dbody">
    <h3>${esc(p.t)}</h3>
    <div class="a-letter">${rows.length ? `<dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>` : ''}
      ${p.body ? `<div class="a-body">${esc(p.body)}</div>` : ''}${p.hint ? `<p class="a-hint">${p.hint}</p>` : ''}</div>
    <div class="a-why"><label for="deny-msg">Si dices que no, ¿por qué? (opcional)</label><input type="text" id="deny-msg" placeholder="Por ejemplo: todavía no"></div>
    </div><div class="dfoot">
      <button type="button" class="a-btn a-sec" data-act="denyAsk">${icon('x')}No</button><span class="grow"></span>
      <button type="button" class="a-btn a-q a-always" data-act="allowAsk" data-arg="${q.suggestions?.length ? 'always' : 'all'}">Sí, y no vuelvas a preguntar en esta petición</button>
      <button type="button" class="a-btn a-pri" data-act="allowAsk">${icon('check')}Sí, adelante</button>
    </div></form>`;
}

  const marks = [['done', 'Ya puedes leer la respuesta.'], ['asking', 'Tiene una pregunta para ti. Ábrela y contesta.'], ['working', 'Está en ello. No hace falta que esperes aquí.'],
    ['stopped', 'Se paró antes de terminar. Escribe para seguir.'], ['failed', 'Algo falló. Escribe para intentarlo otra vez.']];
  main.innerHTML = `<div class="a-col a-help">
    <h1>Cómo funciona</h1>
    <p class="a-lede">Pides lo que necesitas, Flows se pone a ello y te avisa cuando está listo o cuando necesita que decidas algo.</p>
    <ol class="a-card a-steps">
      <li><b>Pide lo que necesitas</b><p>Escríbelo con tus palabras, o toca Correo, Documentos, Agenda u Otra cosa para ver ideas. Después pulsa <b>Pedir</b>.</p></li>
      <li><b>Te avisamos</b><p>Tu petición aparece en <b>Mis peticiones</b>. Mientras pone <b>Trabajando</b>, está en ello. Cuando pone <b>Listo</b>, ya puedes leer la respuesta.</p></li>

    </ol>
    <section class="a-card a-can"><h2>Qué puede hacer</h2><ul><li>Leer y buscar en tu correo, tus documentos y tu agenda.</li><li>Preparar borradores de correos y resúmenes.</li><li>Con tu permiso, enviar correos, guardar documentos o apuntar citas.</li></ul></section>
    <section class="a-card a-can"><h2>Qué no puede hacer</h2><ul><li>Nada fuera de tu correo, tus documentos y tu agenda.</li><li>Nunca envía ni cambia nada sin preguntarte antes.</li></ul></section>
    <h2>Qué significa cada marca</h2>
    <ul class="a-card a-marks">${marks.map(([s, t]) => `<li>${astate(s).replace(' · escribe para seguir', '')}<span>${t}</span></li>`).join('')}</ul>
    <a class="a-btn a-pri a-pedir" href="#">Hacer una petición</a>
  </div>`;
}
