    <div class="capsel perm-grid">${capChips({caps}, capsFor().filter(x => x.id != 'team'), 'perm')}</div>
    ${!caps.includes('browser') ? '' : '<p class="hint">Browser checks use headless Chrome through Playwright; screenshots show up in this session.</p>'}
    <div class="pfoot" style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
      <button class="btn-p" data-act="savePerms">${icon('check')}Apply permissions</button>
      <button class="btn-q" data-act="togglePerms">Cancel</button>
    </div></section>`;
}
ACT.toggleSet = () => { sess.set = !sess.set; drawSession(); };
ACT.toggleTitle = () => { sess.title = !sess.title; $('#s-head h1').classList.toggle('open', sess.title); };
ACT.togglePerms = () => { sess.perms = !sess.perms; drawSession(); drawPerms(); if (sess.perms) $('#s-perms').scrollIntoView({block: 'nearest', behavior: 'smooth'}); };
ACT.savePerms = async (_, btn) => {
  const st = {caps: [...document.querySelectorAll('[data-pcap]:checked')].map(i => i.dataset.pcap)};
  if (st.caps.includes('full') && !sessCaps(sess.r.config).includes('full') && !confirm('Full auto lets agents run any command and edit anything without asking. Continue?')) return;
  const extra = (sess.r.config.allowed_tools || '').split(',').filter(t => t && !CAPS.some(c => c.tools?.split(',').includes(t)) && t != 'Bash' && t != 'mcp__playwright');
  btn.setAttribute('aria-busy', 'true');
  try {
    const {applied} = await api(`sessions/${sess.id}/config`, {method: 'POST', body: JSON.stringify({caps: st.caps, allowed_tools: [capTools(st), ...extra].filter(Boolean).join(','), permission_mode: capMode(st)})});
    sess.perms = false; drawPerms();
    toast({now: 'Permissions updated', 'after-turn': 'Saved: applies when the current turn ends', 'next-message': 'Saved: applies on your next message'}[applied]);
    clearTimeout(timer); showSession();
  } catch (e) { toast('Could not save: ' + e.message, true); btn.removeAttribute('aria-busy'); }
};

async function send(text, agents, sub_models, files) {
  try {
    await api(`sessions/${sess.id}/message`, {method: 'POST', body: JSON.stringify({text, agents, sub_models, files})});
    clearTimeout(timer); showSession(); return true;
  } catch (e) { toast(tr('Not sent: ' + e.message, 'No se ha podido enviar. Revisa la conexión e inténtalo otra vez.'), true); }
}
ACT.selAgent = id => { sessSel = id; forceStick = true; drawSession(); if (id == 'lead' && sess.r.status == 'asking') ACT.openAsk(); };
ACT.sendMsg = async () => {
  const m = $('#msg'), text = m.value.trim(); if (!text && !att.length) return m.focus();
  forceStick = true;
  if (await send(text, null, null, await packFiles())) { m.value = ''; m.style.height = ''; att = []; drawAtts(); }
};
ACT.queueMsg = async () => {
  const m = $('#msg'), text = m.value.trim(); if (!text && !att.length) return m.focus();
  try {
    await api('queue', {method: 'POST', body: JSON.stringify({kind: 'message', run_id: sess.id, text, files: await packFiles()})});
    m.value = ''; m.style.height = ''; att = []; drawAtts(); toast('Queued: sent when the lead agent is free'); refresh();
  } catch (e) { toast('Could not queue: ' + e.message, true); }
};
function drawSessQueue() {
  const el = $('#s-queue'); if (!el || !sess) return;
  const mine = queue.items.filter(q => q.kind == 'message' && q.run_id == sess.id);
  el.innerHTML = mine.length ? `<p class="flabel" style="color:var(--mute);margin:0 0 6px">Queued messages · sent in order when the lead agent is free${queue.limited_until ? ` and the usage limit resets at ${new Date(queue.limited_until * 1000).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'})}` : ''}</p>
    ${mine.map(q => delRow('q:' + q.id, 'queued message', q.name, `<span class="item">${icon('list')}<span>${esc(q.text || q.name)}</span></span>`)).join('')}` : '';
}
ACT.faster = () => ACT.setAgents(2);
ACT.compact = () => {
  const busy = ['working', 'asking'].includes(sess.r.status);
  send('/compact').then(ok => ok && toast(busy ? 'Compacts as soon as the current turn ends' : 'Compacting the conversation…'));
};
ACT.setAgents = d => {
  const cur = sess.r.config.agents || 3, n = Math.max(1, Math.min(12, cur + +d));
  if (n == cur) return;
  send(n > cur
    ? `Go faster: you may now run up to ${n} subagents in parallel. Split the remaining work further and launch additional subagents right away; only wait where there is a real dependency.`
    : `Slow down: run at most ${n} subagents at once from now on. Let current ones finish; do not launch new ones until you are under the limit.`, n)
    .then(ok => ok && toast(`Parallel agents: ${n}`));
};
ACT.quick = k => send({status: 'Give me a short status update: what is done, what each running subagent is doing, what is left, and anything you need from me.',
  wrap: 'Wrap up: do not start new work. Let running subagents finish, integrate their work, run the build and php -l, then give me a final report.'}[k]);
ACT.stopSess = async () => { if (!confirm('Stop this session? Running subagents are interrupted. You can resume it later by sending a message.')) return; await api(`sessions/${sess.id}/stop`, {method: 'POST'}); toast('Session stopped'); };

async function drawQr(text) {
  try {
    if (!qrLib) qrLib = new Promise((ok, no) => { const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js'; sc.onload = ok; sc.onerror = no; document.head.append(sc); });
    await qrLib;
    const q = qrcode(0, 'M'); q.addData(text); q.make();
    const el = $('#qr'); if (el) el.innerHTML = q.createSvgTag({cellSize: 5, margin: 2, scalable: true});
  } catch { const el = $('#qr'); if (el) el.outerHTML = ''; }
}

];
const admActText = n => ADM_ACTS.find(([re]) => re.test(n))?.[1] || 'Trabajando…';
const HIDDEN_TOOLS = ['ToolSearch', 'TodoWrite', 'AskUserQuestion'];
function admMd(s) {  // the little markdown assistants write: paragraphs, headings, numbered lists with sub-bullets, bold, links
  const inl = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '$1')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  let out = '', top = null, li = false, sub = false, n = 0, m;  // top: open top-level list; li: its item is still open
  const endSub = () => { if (sub) out += '</ul>'; sub = false; };
  const endLi = () => { endSub(); if (li) out += '</li>'; li = false; };
  const endTop = () => { endLi(); if (top) out += `</${top}>`; top = null; };
  for (const line of s.split('\n')) {
    if (!line.trim()) continue;  // blank lines never split a list; a plain paragraph does
    const ind = line.match(/^\s*/)[0].length;
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) endTop();
    else if ((m = line.match(/^\s*(\d+)[.)]\s+(.*)/))) {
      const k = +m[1];
      if (top != 'ol' || k <= n) { endTop(); out += k == 1 ? '<ol>' : `<ol start="${k}">`; top = 'ol'; } else endLi();
      n = k; out += `<li>${inl(m[2])}`; li = true;
    } else if ((m = line.match(/^\s*[-*•]\s+(.*)/))) {
      if (li && (top == 'ol' || ind >= 2)) { if (!sub) out += '<ul>'; sub = true; out += `<li>${inl(m[1])}</li>`; }
      else { if (top != 'ul') { endTop(); out += '<ul>'; top = 'ul'; } else endLi(); out += `<li>${inl(m[1])}`; li = true; }
    } else if (li && ind >= 2) { endSub(); out += `<p>${inl(line.trim())}</p>`; }
    else {
      endTop();
      if ((m = line.match(/^#{1,6}\s+(.*)/))) out += `<h3>${inl(m[1])}</h3>`; else out += `<p>${inl(line)}</p>`;
    }
  }
  endTop(); return out;
}
function admItem(e, T, first) {
  if (e.type == 'input') return e == first || e.text.trim() == '/compact' ? '' : `<div class="a-you"><span class="a-who">Tú</span>${esc(e.text)}${e.files ? `<div class="atts">${e.files.map(f => {

    return `<a class="att" href="${src}" ${f.image ? 'target="_blank" rel="noopener"' : 'download'}>${f.image ? `<img src="${src}" alt="" loading="lazy">` : icon('file')}<span>${esc(f.name)}</span></a>`;
  }).join('')}</div>` : ''}</div>`;
  const note = (ic, h) => `<div class="a-note">${icon(ic)}<span>${h}</span></div>`;
  if (e.type == 'ask') return note('bell', e.tool == 'AskUserQuestion' ? `Te preguntó: <b>${esc(e.input.questions?.map(q => q.question).join(' / '))}</b>` : `Te pidió permiso: <b>${esc(admPerm(e).t)}</b>`);
  if (e.type == 'answer') return note(e.allow ? 'check' : 'x', e.tool == 'AskUserQuestion'
    ? (e.allow ? `Respondiste: <b>${esc(Object.values(e.answers || {}).join(' / '))}</b>` : 'Le dejaste decidir a él')

  const c = Array.isArray(e.message?.content) ? e.message.content : [];
  if (e.type == 'assistant') return c.map(x => {

    if (x.type != 'tool_use' || HIDDEN_TOOLS.includes(x.name)) return '';

  }).join('');
  if (e.type == 'system' && e.subtype == 'task_notification' && T[e.tool_use_id]) return note(e.status == 'completed' ? 'check' : 'x', `${e.status == 'completed' ? 'Un ayudante ha terminado' : 'Un ayudante no pudo terminar'}: ${esc(T[e.tool_use_id].desc)}`);

  if (e.type == 'result' && e.is_error) return `<div class="a-err">Algo ha fallado y esta parte no se ha podido terminar. Puedes escribir abajo para intentarlo otra vez.</div>`;
  return '';  // tool results, costs, raw output: never shown here
}

}
ACT.admStop = async () => {
  if (!confirm('¿Parar esta petición? Podrás seguir con ella más tarde escribiendo un mensaje.')) return;
  try { await api(`sessions/${sess.id}/stop`, {method: 'POST'}); toast('Petición parada'); } catch { toast('No se ha podido parar. Inténtalo otra vez.', true); }
};

/* ---- decisions: same reply()/ACT handlers as dev, plain-language rendering ---- */
const admAskBar = (pend, q) => `<button class="a-askbar" data-act="openAsk">${icon('bell')}<span><b>${pend.length > 1 ? `Te necesita para ${pend.length} cosas` : 'Te necesita'}</b> · ${esc(q.tool == 'AskUserQuestion' ? (q.input.questions || []).map(x => x.question).join(' · ') : admPerm(q).t)}</span><span class="go">Contestar ${icon('right')}</span></button>`;
const admBand = () => `<div class="a-band"><h2 id="decide-h">${icon('bell')}Necesito que decidas</h2><p>Turno ${NO[sess?.id] || ''} · ${esc(catName(sess?.id))}</p></div>`;
function admAskQ(qs) {
  return `<form method="dialog" id="ask-form">${admBand()}<div class="a-dbody">
    ${qs.map((x, i) => `<fieldset><legend>${esc(x.question)}</legend>${x.multiSelect ? '<p class="a-hint">Puedes elegir varias.</p>' : ''}
      ${(x.options || []).map((o, j) => `<label class="opt"><input type="${x.multiSelect ? 'checkbox' : 'radio'}" name="q${i}" value="${esc(o.label)}" ${!x.multiSelect && j == 0 ? 'required' : ''}>
        <span class="box">${icon('check')}</span><span><b>${esc(o.label)}</b>${o.description ? `<small>${esc(o.description)}</small>` : ''}</span></label>`).join('')}
      <label class="opt other"><input type="${x.multiSelect ? 'checkbox' : 'radio'}" name="q${i}" value="__other"><span class="box">${icon('check')}</span>
        <span style="flex:1"><b>Otra cosa</b><input type="text" name="o${i}" placeholder="Escríbelo aquí" aria-label="Otra respuesta"></span></label></fieldset>`).join('')}
    </div><div class="dfoot">
      <button type="button" class="a-btn a-q" data-act="skipAsk">Decide tú</button><span class="grow"></span>
      <button type="button" class="a-btn a-sec" data-act="closeAsk">Más tarde</button>
      <button type="submit" class="a-btn a-pri">${icon('send')}Enviar respuesta</button>
    </div></form>`;
}
function admPerm(q) {  // what the agent wants to do, as a plain question plus the facts that matter
  const n = q.tool || '', i = q.input || {}, all = v => [].concat(v || []).join(', ');
  const text = v => String(v || '').replace(/<br\s*\/?>|<\/p>/gi, '\n').replace(/<[^>]+>/g, '').trim();
  const when = v => { if (!v) return ''; const d = new Date(v.dateTime || v.date || v); return isNaN(d) ? String(v.dateTime || v.date || v) : d.toLocaleString('es-ES', {weekday: 'long', day: 'numeric', month: 'long', ...(v.date && !v.dateTime ? {} : {hour: '2-digit', minute: '2-digit'})}); };
  if (/Gmail__(send_message|reply|forward)/.test(n)) return {t: i.draftId && !i.body ? '¿Puedo enviar este borrador?' : '¿Puedo enviar este correo?', rows: [['Para', all(i.to)], ['Copia', all(i.cc)], ['Asunto', i.subject]], body: i.body || text(i.htmlBody)};
  if (/Gmail__(create_draft|update_draft)/.test(n)) return {t: '¿Puedo guardar este borrador?', rows: [['Para', all(i.to)], ['Asunto', i.subject]], body: i.body || text(i.htmlBody), hint: 'Se guarda en tus borradores. No se envía.'};
  if (/Drive__(create_file|update_file|copy_file)/.test(n)) return {t: '¿Puedo guardar este documento?', rows: [['Nombre', i.title || i.name]], body: String(i.textContent || '').slice(0, 1500)};
  if (/Drive__share_file/.test(n)) return {t: '¿Puedo compartir este documento?', rows: [['Con', all(i.emailAddress || i.email || i.emails)]]};
  if (/Calendar__(create_event|update_event)/.test(n)) return {t: '¿Puedo apuntar esto en tu agenda?', rows: [['Qué', i.summary || i.title], ['Cuándo', when(i.start || i.startTime)], ['Hasta', when(i.end || i.endTime)], ['Dónde', i.location], ['Con', all((i.attendees || []).map(a => a.email || a))]], body: i.description};
  return {t: '¿Puedo hacer esto?', rows: [['Qué', admActText(n).replace('…', '')]]};
}
function admAskPerm(q) {
  const p = admPerm(q), rows = p.rows.filter(([, v]) => v);
  return `<form method="dialog" id="ask-form">${admBand()}<div class="a-dbody">
    <h3>${esc(p.t)}</h3>
    <div class="a-letter">${rows.length ? `<dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>` : ''}
      ${p.body ? `<div class="a-body">${esc(p.body)}</div>` : ''}${p.hint ? `<p class="a-hint">${p.hint}</p>` : ''}</div>
    <div class="a-why"><label for="deny-msg">Si dices que no, ¿por qué? (opcional)</label><input type="text" id="deny-msg" placeholder="Por ejemplo: todavía no, primero quiero revisarlo"></div>
    </div><div class="dfoot">
      <button type="button" class="a-btn a-sec" data-act="denyAsk">${icon('x')}No</button><span class="grow"></span>
      <button type="button" class="a-btn a-q a-always" data-act="allowAsk" data-arg="${q.suggestions?.length ? 'always' : 'all'}">Sí, y no vuelvas a preguntar en esta petición</button>
      <button type="button" class="a-btn a-pri" data-act="allowAsk">${icon('check')}Sí, adelante</button>
    </div></form>`;
}

/* ---- help ---- */
function admGuide() {
  const step = (n, t, p) => `<li class="a-tkw"><div class="a-ticket"><div class="a-tt"><span class="a-tno">Paso<b>${n}</b></span></div><h2>${t}</h2><p>${p}</p></div></li>`;
  main.innerHTML = `<div class="a-page">
    <header><h1>Cómo funciona</h1><p>Es como pedir número en una ventanilla: dices qué necesitas, te atienden y, si hace falta, te preguntan.</p></header>
    <ol class="a-steps">
      ${step(1, 'Pide lo que necesitas', 'Escríbelo con tus palabras, o pulsa Correo, Documentos o Agenda para ver ideas. Pulsa <b>Pedir</b> y te damos un número.')}
      ${step(2, 'Te atendemos y te avisamos', 'Tu número sale en la pantalla de turnos. Mientras pone <b>Atendiendo</b>, está trabajando. Cuando pone <b>Listo</b>, ya puedes leer la respuesta.')}
      ${step(3, 'Decide cuando te lo pidan', 'Si pone <b>Te necesita</b>, te hará una pregunta sencilla. Antes de enviar un correo o guardar algo, siempre te pide permiso.')}
    </ol>
    <div class="a-can">
      <section class="ok"><h2>${icon('check')}Qué puede hacer</h2><ul><li>Leer y buscar en tu correo, tus documentos y tu agenda.</li><li>Preparar borradores de correos y resúmenes.</li><li>Con tu permiso, enviar correos, guardar documentos o apuntar citas.</li></ul></section>
      <section class="no"><h2>${icon('x')}Qué no puede hacer</h2><ul><li>Nada fuera de tu correo, tus documentos y tu agenda.</li><li>Nunca envía ni cambia nada sin preguntarte antes.</li></ul></section>
    </div>
    <a class="a-btn a-pri" href="#">${icon('ticket')}Hacer una petición</a>
  </div>`;
}

addEventListener('hashchange', route);
route();
setInterval(() => { if (!document.hidden && !draft) refresh(); }, 5000);
</script>
</body>
